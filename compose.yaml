# Host port 5433, so this can run next to another Postgres on 5432.
name: help-desk

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5433:5432"
    volumes:
      # Keeps your data when containers stop or restart. Only `docker compose down -v` deletes it.
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
