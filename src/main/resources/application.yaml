spring:
  application:
    name: help-desk
  datasource:
    url: jdbc:postgresql://localhost:5433/helpdesk
    username: helpdesk
    password: helpdesk
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always

escalation-job-schedule-window: "5m"

escalation:
  windows:
    LOW: "3d"
    NORMAL: "1d"
    HIGH: "4h"
    URGENT: "1h"