name: CI

# Runs on every pull request, docs-only ones included, so the required check always reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Lets the coverage step comment on the pull request.
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # `build` runs the tests and the JaCoCo check, so it fails when line coverage is below 80%.
      - run: ./gradlew build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: ignore
      # Posts overall and changed-file coverage as one PR comment, updated on each push, and in the run summary.
      # Runs when the build fails on coverage too, so the comment shows what fell short.
      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: Code coverage
          update-comment: true
          comment-type: both
